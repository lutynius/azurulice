<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <title>Azurulice (Azurové Ulice)</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div id="main-menu">
            <H1 id="note">1 MĚSÍC!</H1>

            <h1 id="main-menu-title">Vítej v Azurulice! (Azurové ulice)</h1>
            <h2 id="main-menu-subtitle">Kvíz na random ulice z Moravskoslezského kraje</h2>
            <button id="start-button">Start</button>
            <button id="change-colorscheme-button">Změnit barevné schéma</button>
            <button id="changelog-button">Protokol změn</button>
        </div>

        <div id="colorscheme-settings">
            <button id="go-back-button">Zpět</button>
            <section id="tricolor">
                <div class="showcase-colors" id="tricolor-showcase-color-1"></div>
                <div class="showcase-colors" id="tricolor-showcase-color-2"></div>
                <div class="showcase-colors" id="tricolor-showcase-color-3"></div>
                <h1>Trikolóra</h1>
                <button id="change-to-tricolor-button">Změnit</button>
            </section>
            <section id="triumvirate">
                <div class="showcase-colors" id="triumvirate-showcase-color-1"></div>
                <div class="showcase-colors" id="triumvirate-showcase-color-2"></div>
                <div class="showcase-colors" id="triumvirate-showcase-color-3"></div>
                <h1>Triumvirát (Výchozí)</h1>
                <button id="change-to-triumvirate-button">Změnit</button>
            </section>
            <section id="light">
                <div class="showcase-colors" id="light-showcase-color-1"></div>
                <div class="showcase-colors" id="light-showcase-color-2"></div>
                <div class="showcase-colors" id="light-showcase-color-3"></div>
                <h1>Světlo</h1>
                <button id="change-to-light-button">Změnit</button>
            </section>
            <section id="dark">
                <div class="showcase-colors" id="dark-showcase-color-1"></div>
                <div class="showcase-colors" id="dark-showcase-color-2"></div>
                <div class="showcase-colors" id="dark-showcase-color-3"></div>
                <h1>Temno</h1>
                <button id="change-to-dark-button">Změnit</button>
            </section>
            <section id="blud">
                <div class="showcase-colors" id="blud-showcase-color-1"></div>
                <div class="showcase-colors" id="blud-showcase-color-2"></div>
                <div class="showcase-colors" id="blud-showcase-color-3"></div>
                <h1>Blud</h1>
                <button id="change-to-blud-button">Změnit</button>
            </section>
            <section id="brevipartyon">
                <div id="brevipartyon-color-1" class="showcase-colors"></div>
                <div id="brevipartyon-color-2" class="showcase-colors"></div>
                <div id="brevipartyon-color-3" class="showcase-colors"></div>
                <h1>Brevipartyon</h1>
                <button id="change-to-brevipartyon-button">Nastavit</button>
            </section>
        </div>

        <div id="changelog">
            <button id="go-to-menu-button">Zpět</button>
            <div id="updatelog">
                <p id="updatelog-text"></p>
            </div>
        </div>

        <div id="question">
            <header id="header">
                <h1 id="text">Texten</h1>
                <p id="copyright_header">Zdroj map: mapy.com</p>
            </header>
            <main id="main">
                <img id="image" src="images/okruzni.png" alt="Obrázek nějaké české ulice z webové stránky mapy.com - Konkrétní ulice se neví, jelikož tohle je kvíz a tenhle obrázek se frekventně mění">
            </main>
            <footer id="footer">
                <input id="input" type="text">
                <button id="submit-button" type="submit">Submit</button>
                <img id="dispatcher16" src="images/dispatcher16.png" alt="Obrázek poflaxanském Robotovi co potlačuje svůj hněv proti Markovi. Tenhle obrázek je zobrazen pouze při ulicích Adamusova v Orlové a Na Olmovci, jinak je tenhle obrázek zakryt.">
            </footer>
        </div>

        <div id="end-results">
            <h1>Konec!</h1>
            <h2>Pročetl jsi všechny ulice!</h2>
            <h1>Výsledný počet bodů:</h1>
            <h1 id="result">
                <span id="score-acquired">x</span>
                 / 
                <span id="score-maximum">y</span>
            </h1>
            <h1>
                <span id="percentage">z</span>%
            </h1>
        </div>

        <script type="module" src="script.js" defer></script>

    </body>

</html>
